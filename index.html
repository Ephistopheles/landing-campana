<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      data-i18n-attr="content:meta.description"
      content=""
    />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icons/globe.svg" />
    <link rel="stylesheet" href="./src/styles/styles.css" />
    <title data-i18n="meta.title"></title>
  </head>
  <body>
    <!-- Nav buttons -->
    <nav class="topnav" aria-label="Settings">
      <button class="topnav__btn" id="lang-btn" type="button" title="Change language">
        <img src="./src/assets/icons/language.svg" alt="" class="topnav__icon" draggable="false" />
        <span id="lang-label">EN</span>
      </button>
      <button class="topnav__btn" id="theme-btn" type="button" title="Change theme">
        <img src="./src/assets/icons/sun.svg" alt="" class="topnav__icon" draggable="false" />
      </button>
    </nav>

    <!-- Hero -->
    <header class="hero">
      <div class="hero__particles" aria-hidden="true"></div>
      <div class="hero__content">
        <div class="hero__avatar">
          <img
            src="./src/assets/avatars/rick-avatar.png"
            draggable="false"
            alt="Rick Sanchez avatar"
            class="hero__img"
          />
          <p>text conflict</p>
        </div>
        <h1 class="hero__name">Rick Sanchez</h1>
        <p class="hero__subtitle" data-i18n="hero.subtitle"></p>
        <p class="hero__slogan" data-i18n="hero.slogan"></p>
      </div>
    </header>

    <!-- About -->
    <section class="about" id="about">
      <h2 class="section__title" data-i18n="about.title"></h2>
      <p class="about__text" data-i18n="about.text"></p>
    </section>

    <!-- Proposals -->
    <section class="proposals" id="proposals">
      <h2 class="section__title" data-i18n="proposals.title"></h2>
      <div class="proposals__grid">
        <article class="proposal-card">
          <img src="./src/assets/icons/test-tube.svg" alt="" class="proposal-card__icon" draggable="false" />
          <h3 class="proposal-card__title" data-i18n="proposals.items.0.title"></h3>
          <p class="proposal-card__text" data-i18n="proposals.items.0.text"></p>
        </article>

        <article class="proposal-card">
          <img src="./src/assets/icons/shield.svg" alt="" class="proposal-card__icon" draggable="false" />
          <h3 class="proposal-card__title" data-i18n="proposals.items.1.title"></h3>
          <p class="proposal-card__text" data-i18n="proposals.items.1.text"></p>
        </article>

        <article class="proposal-card">
          <img src="./src/assets/icons/beer-mug.svg" alt="" class="proposal-card__icon" draggable="false" />
          <h3 class="proposal-card__title" data-i18n="proposals.items.2.title"></h3>
          <p class="proposal-card__text" data-i18n="proposals.items.2.text"></p>
        </article>

        <article class="proposal-card">
          <img src="./src/assets/icons/dna.svg" alt="" class="proposal-card__icon" draggable="false" />
          <h3 class="proposal-card__title" data-i18n="proposals.items.3.title"></h3>
          <p class="proposal-card__text" data-i18n="proposals.items.3.text"></p>
        </article>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta" id="cta">
      <button class="cta__button" id="rick-btn" type="button">
        <img src="./src/assets/icons/ballot-box.svg" alt="" class="cta__icon" draggable="false" />
        <span data-i18n="cta"></span>
      </button>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast" aria-live="polite"></div>

    <footer class="footer">
      <p data-i18n="footer"></p>
    </footer>

    <script type="module" src="./src/scripts/scripts.js"></script>
  </body>
</html>
